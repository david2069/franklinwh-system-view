[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "franklinwh-system-view"
version = "0.3.0"
description = "A friendly picture of a FranklinWH site (grid, aGate, batteries, solar, home, circuits) shared by the FranklinWH bridges: payload schema, layout and the overlay page"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "david2069"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Source = "https://github.com/david2069/franklinwh-system-view"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
franklinwh_system_view = ["static/*", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
